[project]
name = "doc-intel-agent"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",

    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"